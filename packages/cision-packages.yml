description: >-
  First-party Cision packages found on the public registries. THE HEADLINE FINDING
  IS AN ABSENCE — Cision ships no client library for either of its APIs in any
  language. Everything published under the Cision GitHub organisation and npm scope
  is front-end tooling for Cision's own web products, not an SDK a developer would
  use to call api.cision.one or api.trendkite.com.
sdk_count: 0
sdk_note: >-
  No API client library exists on npm, PyPI, RubyGems, Packagist, crates.io,
  Maven Central, NuGet or pkg.go.dev. `pip install cision` and `pip install
  cisionone` both 404. Cision's own help documentation states the position plainly:
  "We don't have any direct connectors for other tools with our Cision API, so the
  development effort to pull from the Cision API and import that data into your
  system of choice falls on you and your developers." No SDKs pointer is emitted in
  apis.yml.

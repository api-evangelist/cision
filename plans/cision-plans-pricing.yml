description: >-
  Cision publishes NO pricing for CisionOne, the CisionOne API, or the Cision
  Communications Cloud. https://www.cision.com/pricing/ redirects (200 via 302) to
  https://www.cision.com/request-pricing/, a sales-contact form. Every platform
  quote is custom, sales-led and annual, and API access is a contract entitlement
  rather than a purchasable line item — a token whose account lacks it receives HTTP
  403 "Token does not have access to the API". The only Cision-family products with
  published, self-serve prices are the entry-level distribution wires, recorded below
  with the figures live on those pages today.

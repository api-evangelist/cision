notes:
  - Cision publishes no platform pricing; every CisionOne and Communications Cloud quote requires sales engagement.
  - API access is an enterprise contract entitlement, not a purchasable plan. HTTP 403 is the runtime signal that an account does not have it.
  - Annual contracts are the standard commercial form; the MSA makes fees non-cancellable and non-refundable absent an Order term to the contrary.
